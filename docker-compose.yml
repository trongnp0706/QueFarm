services:
  quefarm-api:
    build: .
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=QueFarmDb;User Id=sa;Password=7lZOGuxPe9Td65LQqeFuX9pc5oYxgT2w;TrustServerCertificate=true;
      - JwtSettings__SecretKey=d0Oa9zcHAPVfMDCHGxMEyfhAlTXuX2Pn7svFQCXrPhAC
      - JwtSettings__Issuer=QueFarm
      - JwtSettings__Audience=QueFarmUsers
      - JwtSettings__ExpirationInMinutes=30
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./uploads:/app/wwwroot/images
    restart: unless-stopped
    networks:
      - quefarm-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=7lZOGuxPe9Td65LQqeFuX9pc5oYxgT2w
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped
    networks:
      - quefarm-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  sqlserver_data:

networks:
  quefarm-network:
    driver: bridge