server {
    listen 80;
    server_name quefarm.page www.quefarm.page;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quefarm.page www.quefarm.page;
    
    ssl_certificate /etc/letsencrypt/live/quefarm.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quefarm.page/privkey.pem;
    
    # Serve static frontend files
    root /opt/quefarm/frontend/dist;
    index index.html;
    
    # Proxy API requests (must be before general location)
    location /api/ {
        proxy_pass http://localhost:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy Swagger (must be before general location)
    location /swagger/ {
        proxy_pass http://localhost:8080/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy Images to API server - CRITICAL for image display (must be before general location)
    location /images/ {
        proxy_pass http://localhost:8080/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache images for better performance
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # Static assets caching (for frontend assets only)
    location ~* \.(js|css|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Handle React Router (SPA) - MUST be last
    location / {
        try_files $uri $uri/ /index.html;
    }
} 