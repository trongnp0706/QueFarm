services:
  quefarm-api:
    build: .
    ports:
      - "8080:80"
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_HTTP_PORTS=80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER:-QueFarm}
      - JwtSettings__Audience=${JWT_AUDIENCE:-QueFarmUsers}
      - JwtSettings__ExpirationInMinutes=${JWT_EXP_MINUTES:-30}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS:-https://quefarm.page;https://www.quefarm.page}
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./uploads:/app/wwwroot/images
    restart: unless-stopped
    networks:
      - quefarm-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup
    restart: unless-stopped
    networks:
      - quefarm-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c 'cat < /dev/null > /dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  sqlserver_data:

networks:
  quefarm-network:
    driver: bridge